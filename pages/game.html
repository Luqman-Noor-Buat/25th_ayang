<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tangkap Hatiku ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

overflow:hidden;

background:linear-gradient(135deg,#0f172a,#1e293b);

font-family:Poppins,sans-serif;

height:100vh;

color:white;

}

h1{

font-family:Great Vibes;

font-size:58px;

margin-top:30px;

text-align:center;

color:#ff76b6;

}

p{

text-align:center;

font-size:20px;

margin-top:10px;

}

#score{

text-align:center;

font-size:28px;

margin-top:20px;

font-weight:bold;

}

.heart{

position:absolute;

font-size:42px;

cursor:pointer;

user-select:none;

animation:jatuh linear forwards;

}

@keyframes jatuh{

0%{

transform:translateY(-60px);

}

100%{

transform:translateY(110vh);

}

}

#win{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

background:white;

color:#222;

padding:35px;

border-radius:20px;

text-align:center;

box-shadow:0 0 40px hotpink;

}

#win button{

margin-top:20px;

padding:12px 30px;

border:none;

background:#ff2d75;

color:white;

border-radius:30px;

cursor:pointer;

font-size:18px;

}

</style>

</head>

<body>

<h1>Tangkap Semua Hatiku ❤️</h1>

<p>Klik hati yang jatuh sampai terkumpul 10 ❤️</p>

<div id="score">

0 / 10

</div>

<div id="win">

<h2>🎉 Hebat!</h2>

<p>

Kamu berhasil menangkap semua cintaku ❤️

</p>

<button onclick="nextPage()">

Lanjut 🎁

</button>

</div>

<script>

let score=0;

const target=10;

function buatHati(){

const hati=document.createElement("div");

hati.className="heart";

hati.innerHTML="❤️";

hati.style.left=Math.random()*90+"vw";

hati.style.animationDuration=(3+Math.random()*3)+"s";

document.body.appendChild(hati);

hati.onclick=function(){

score++;

document.getElementById("score").innerHTML=

score+" / "+target;

hati.remove();

if(score>=target){

document.getElementById("win").style.display="block";

clearInterval(game);

}

};

setTimeout(()=>{

hati.remove();

},7000);

}

const game=setInterval(buatHati,700);

function nextPage(){

window.location.href="puzzle.html";

}

</script>

</body>
</html>
