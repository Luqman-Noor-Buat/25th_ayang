<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surat Untuk Ayang ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:linear-gradient(135deg,#0f172a,#1e293b);

font-family:Poppins,sans-serif;

display:flex;

justify-content:center;

align-items:flex-start;

min-height:100vh;

overflow-y:auto;

overflow-x:hidden;

color:white;

padding:40px 20px;

}

#bgHeart{

position:fixed;

inset:0;

overflow:hidden;

pointer-events:none;

}

.heart{

position:absolute;

font-size:22px;

animation:fall linear forwards;

}

@keyframes fall{

0%{

transform:translateY(-50px);

opacity:1;

}

100%{

transform:translateY(110vh);

opacity:0;

}

}

.card{

width:92%;

max-width:700px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(15px);

padding:35px;

border-radius:25px;

box-shadow:0 0 30px rgba(255,105,180,.25);

}

h1{

font-family:Great Vibes;

font-size:60px;

text-align:center;

margin-bottom:25px;

color:#ff77b7;

}

#text{

font-size:20px;

line-height:1.9;

white-space:pre-line;

min-height:280px;

}

.cursor{

display:inline-block;

animation:blink .7s infinite;

}

@keyframes blink{

50%{

opacity:0;

}

}

button{

margin-top:35px;

width:100%;

padding:16px;

border:none;

border-radius:40px;

background:#ff2d75;

color:white;

font-size:20px;

cursor:pointer;

display:none;

transition:.3s;

}

button:hover{

transform:scale(1.05);

}

</style>

</head>

<body>
  
<audio id="bgMusic" autoplay loop>
    <source src="../assets/music.mp3" type="audio/mpeg">
    Browser Anda tidak mendukung audio.
</audio>

<div id="bgHeart"></div>

<div class="card">

<h1>Untuk Ayang ❤️</h1>

<div id="text"></div>

<button id="next">

Lihat Kejutan Terakhir Ayang 🎂

</button>

</div>

<script>

const isi=`

Selamat ulang tahun sayang ❤️

Semoga di umur yang baru ini, ayang selalu diberikan kesehatan, kebahagiaan, dan rezeki yang melimpah ayang.

Semoga semua impian ayang tercapai satu per satu.

Terima kasih karena sudah hadir dan menjadi seseorang yang begitu berarti.

Terima kasih sudah selalu ada dan menjadi rumah ternyaman untuk mas.

Semoga senyum ayang tidak pernah hilang.

Semoga setiap langkah ayang selalu dipenuhi kebahagiaan.

Dan semoga...

Kita segera menikah ayang.

Happy Birthday ❤️

Mas Love Ayang ❤️

`;

const text=document.getElementById("text");

const btn=document.getElementById("next");

let i=0;

function ketik(){

if(i<isi.length){

text.innerHTML=isi.substring(0,i)+"<span class='cursor'>|</span>";

i++;

setTimeout(ketik,40);

}else{

text.innerHTML=isi;

btn.style.display="block";

}

}

ketik();

btn.onclick=function(){

window.location.href="surprise.html";

}

function hati(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(4+Math.random()*4)+"s";

document.getElementById("bgHeart").appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(hati,450);

const music = document.getElementById("bgMusic");

// Coba autoplay
music.play().catch(() => {
    console.log("Autoplay diblokir browser.");

    // Jika diblokir, musik akan diputar setelah interaksi pertama
    document.addEventListener(
        "click",
        () => {
            music.play();
        },
        { once: true }
    );
});

</script>

</body>
</html>
